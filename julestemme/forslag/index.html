<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foreslå et formål | Racoon</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --mint: #3BD4AE;
    --mint-dark: #1fa585;
    --ink: #14211d;
    --soft: #f3faf7;
    --muted: #5b6b66;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Poppins", system-ui, sans-serif; color: var(--ink); background: var(--soft); line-height: 1.6; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 18px; }

  header { padding: 18px 0; }
  header .wrap { display: flex; justify-content: space-between; align-items: center; }
  header img { height: 30px; }
  .lang { display: flex; background: #fff; border-radius: 999px; padding: 4px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  .lang button {
    border: 0; background: transparent; font: inherit; font-weight: 600; font-size: 14px;
    padding: 6px 14px; border-radius: 999px; cursor: pointer; color: var(--muted);
  }
  .lang button.on { background: var(--mint); color: var(--ink); }

  .hero { text-align: center; padding: 26px 0 34px; }
  .tag { display: inline-block; background: #fff; border: 2px solid var(--mint); color: var(--mint-dark); font-weight: 600; font-size: 13px; padding: 5px 14px; border-radius: 999px; margin-bottom: 16px; }
  h1 { font-size: clamp(30px, 8vw, 46px); line-height: 1.12; margin: 0 0 16px; font-weight: 800; }
  h1 span { color: var(--mint-dark); }
  .hero p { font-size: 17px; color: var(--muted); margin: 0 auto 24px; }
  .deadline { display: inline-block; background: var(--ink); color: #fff; font-weight: 600; padding: 10px 20px; border-radius: 999px; font-size: 15px; }

  .box { background: #fff; border-radius: 22px; padding: 24px; margin-bottom: 22px; box-shadow: 0 6px 24px rgba(0,0,0,.05); }
  h2 { font-size: 22px; margin: 0 0 12px; }
  .steps { list-style: none; padding: 0; margin: 0; }
  .steps li { display: flex; gap: 14px; align-items: flex-start; padding: 10px 0; }
  .steps .n { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--mint); display: grid; place-items: center; font-weight: 800; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips span { background: var(--soft); border: 1px solid #d5ebe3; border-radius: 999px; padding: 6px 12px; font-size: 14px; }
  .hint { color: var(--muted); font-size: 14px; margin: 12px 0 0; }

  .placeholder { text-align: center; color: var(--muted); padding: 34px 10px; border: 2px dashed var(--mint); border-radius: 16px; }

  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 20px 0 40px; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <img src="https://racoon.dk/assets/images/Racoon-facility_Logo.svg" alt="Racoon">
    <div class="lang">
      <button data-lang="da" class="on">DA</button>
      <button data-lang="en">EN</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="hero">
    <div class="tag" data-t="tag"></div>
    <h1 data-t="title"></h1>
    <p data-t="intro"></p>
    <div class="deadline" data-t="deadline"></div>
  </div>

  <div class="box">
    <h2 data-t="howTitle"></h2>
    <ul class="steps">
      <li><div class="n">1</div><span data-t="s1"></span></li>
      <li><div class="n">2</div><span data-t="s2"></span></li>
      <li><div class="n">3</div><span data-t="s3"></span></li>
    </ul>
  </div>

  <div class="box">
    <h2 data-t="ideaTitle"></h2>
    <div class="chips">
      <span>Kræftens Bekæmpelse</span>
      <span>Børnecancerfonden</span>
      <span>SOS Børnebyerne</span>
      <span>Julemærkefonden</span>
      <span>Læger uden Grænser</span>
      <span>Røde Kors</span>
      <span>Hjerteforeningen</span>
      <span>Dyrenes Beskyttelse</span>
      <span>Dyreværnet</span>
      <span>WWF</span>
      <span>headspace</span>
      <span>Mødrehjælpen</span>
    </div>
    <p class="hint" data-t="ideaHint"></p>
  </div>

  <div class="box" id="form-box"></div>
</div>

<footer>Racoon · Islevdalvej 182, 2610 Rødovre</footer>

<script>
/* =========================================================
   RET HER: Tally-formularens ID til medarbejderforslag
   (en anden formular end afstemningen)
   Linket ser ud som https://tally.so/r/abc123 - ID'et er "abc123".
   ========================================================= */
const TALLY_ID = "";

/* RET HER: Teksterne på dansk og engelsk */
const tekster = {
  da: {
    tag: "🎄 Kun for Racoon-medarbejdere",
    title: "Hvem skal have vores <span>120.000 kr.?</span>",
    intro: "I år giver vi ikke julegaver til kunderne. Vi giver pengene til gode formål i stedet. Og det er dig, der skal foreslå hvilke.",
    deadline: "Frist: fredag 23. oktober",
    howTitle: "Sådan gør du",
    s1: "Skriv det gode formål, der betyder noget for dig. Det kan være stort eller småt, i Danmark, i dit hjemland eller lige her i Rødovre.",
    s2: "Skriv én linje om, hvorfor det betyder noget for dig.",
    s3: "Vi vælger 10 finalister. I november stemmer kunder og alle andre, og de 3 vindere får 40.000 kr. hver.",
    ideaTitle: "Brug for inspiration?",
    ideaHint: "Du må gerne foreslå noget helt andet. Der er ingen forkerte svar.",
    soon: "📝 Formularen åbner snart"
  },
  en: {
    tag: "🎄 For Racoon employees only",
    title: "Who should get our <span>120,000 kr.?</span>",
    intro: "This year, we're not giving Christmas gifts to our customers. We're giving the money to good causes instead. And you get to suggest which ones.",
    deadline: "Deadline: Friday 23 October",
    howTitle: "How it works",
    s1: "Write down a good cause that matters to you. Big or small, in Denmark, in your home country or right here in Rødovre.",
    s2: "Write one line about why it matters to you.",
    s3: "We pick 10 finalists. In November, customers and everyone else vote, and the 3 winners get 40,000 kr. each.",
    ideaTitle: "Need inspiration?",
    ideaHint: "You can suggest something completely different. There are no wrong answers.",
    soon: "📝 The form opens soon"
  }
};

/* ---- Herunder skal du ikke rette noget ---- */
let sprog = "da";

function visTekst() {
  document.documentElement.lang = sprog;
  document.querySelectorAll("[data-t]").forEach(el => {
    el.innerHTML = tekster[sprog][el.dataset.t];
  });
  document.querySelectorAll(".lang button").forEach(b => {
    b.classList.toggle("on", b.dataset.lang === sprog);
  });
  if (!TALLY_ID) {
    document.getElementById("form-box").innerHTML =
      `<div class="placeholder">${tekster[sprog].soon}</div>`;
  }
}

document.querySelectorAll(".lang button").forEach(b => {
  b.addEventListener("click", () => { sprog = b.dataset.lang; visTekst(); });
});

if (TALLY_ID) {
  document.getElementById("form-box").innerHTML =
    `<iframe data-tally-src="https://tally.so/embed/${TALLY_ID}?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
      loading="lazy" width="100%" height="600" frameborder="0" title="Forslag"></iframe>`;
  const s = document.createElement("script");
  s.src = "https://tally.so/widgets/embed.js";
  s.onload = () => window.Tally && Tally.loadEmbeds();
  document.body.appendChild(s);
}

visTekst();
</script>
</body>
</html>
