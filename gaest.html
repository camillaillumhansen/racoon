<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Racoon - Velkomstskærm</title>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--g:#47D7AC;--bg:#07070d;--card:#10101a;--bdr:#252538;--s:rgba(255,255,255,.55)}
body{background:var(--bg);color:#fff;font-family:'Work Sans',system-ui,sans-serif;min-height:100vh;padding:24px 16px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:1.5rem;font-weight:900}
h1 span{color:var(--g)}
.sub{color:var(--s);font-size:.9rem;margin-top:4px}
.status{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:10px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:#555;flex-shrink:0}
.dot.on{background:var(--g);box-shadow:0 0 10px var(--g)}
.dot.tak{background:#f5c518;box-shadow:0 0 10px #f5c518}
.status small{display:block;color:var(--s);font-weight:500;font-size:.8rem;margin-top:2px}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:16px}
label{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--s);display:block;margin-bottom:6px}
input[type=text],input[type=password],input[type=time]{width:100%;background:#0b0b14;border:1px solid var(--bdr);border-radius:10px;padding:12px 14px;color:#fff;font:600 1rem 'Work Sans',sans-serif}
input:focus{outline:2px solid var(--g);border-color:transparent}
.colors{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw.sel{border-color:#fff;transform:scale(1.08)}
.drop{border:2px dashed var(--bdr);border-radius:12px;padding:18px;text-align:center;cursor:pointer;color:var(--s);font-weight:600;position:relative}
.drop.over{border-color:var(--g);color:var(--g)}
.drop img{max-height:90px;max-width:100%;background:#fff;border-radius:8px;padding:8px;display:block;margin:0 auto 8px}
.drop .rm{margin-top:8px;font-size:.8rem;color:#ef4444;text-decoration:underline;cursor:pointer;display:inline-block}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:none;border-radius:12px;padding:16px;font:800 1rem 'Work Sans',sans-serif;cursor:pointer}
.b-vel{background:var(--g);color:#06231a;grid-column:1/-1;font-size:1.15rem}
.b-tak{background:#f5c518;color:#2a2200}
.b-off{background:#2a2a3a;color:#fff}
button:disabled{opacity:.5}
.msg{min-height:1.2em;font-size:.9rem;font-weight:600;text-align:center}
.msg.err{color:#ef4444}.msg.ok{color:var(--g)}
.foot{color:var(--s);font-size:.8rem;text-align:center;line-height:1.5}
.foot a{color:var(--g)}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>Velkomst<span>skærm</span> 🦝</h1>
    <div class="sub">Udfyld felterne og tryk på en knap. TV'et skifter af sig selv inden for få sekunder.</div>
  </div>

  <div class="status"><div class="dot" id="dot"></div><div><span id="stxt">Henter status...</span><small id="ssub"></small></div></div>

  <div class="card">
    <div><label>Kode</label><input type="password" id="pin" placeholder="Skriv koden" autocomplete="current-password"/></div>
    <div><label>Gæstens navn</label><input type="text" id="navn" placeholder="fx Jesper" maxlength="60"/></div>
    <div><label>Firma / forening</label><input type="text" id="firma" placeholder="fx E/F Vesterhave" maxlength="80"/></div>
    <div>
      <label>Farve</label>
      <div class="colors" id="colors"></div>
    </div>
    <div>
      <label>Logo (valgfrit)</label>
      <div class="drop" id="drop">
        <div id="dropInner">Træk logoet herind<br><small>eller tryk for at vælge en fil</small></div>
      </div>
      <input type="file" id="file" accept="image/*" hidden/>
    </div>
    <div><label>Velkomst slukker selv kl.</label><input type="time" id="slut" value="17:00"/></div>
  </div>

  <div class="btns">
    <button class="b-vel" id="bVel">👋 Velkommen</button>
    <button class="b-tak" id="bTak">🙏 Tak for besøget</button>
    <button class="b-off" id="bOff">Sluk</button>
  </div>
  <div class="msg" id="msg"></div>

  <div class="foot">"Tak for besøget" slukker selv efter 30 minutter.<br><a href="/" target="_blank">Se skærmen</a></div>
</div>

<script>
const FARVER=[['Gul','#f5c518'],['Orange','#f59e0b'],['Rød','#e5432a'],['Pink','#ec4899'],['Lilla','#8b5cf6'],['Blå','#3b82f6'],['Turkis','#47D7AC'],['Lysegrøn','#7cc242'],['Grøn','#4a7c3f'],['Hvid','#ffffff']];
let farve='#f5c518', logo=null, logoChanged=false;
const $=id=>document.getElementById(id);

try{ $('pin').value=localStorage.getItem('racoon_pin')||''; }catch(e){}

function drawColors(){
  $('colors').innerHTML=FARVER.map(([n,h])=>`<div class="sw${h===farve?' sel':''}" title="${n}" style="background:${h}" data-h="${h}"></div>`).join('');
  document.querySelectorAll('.sw').forEach(el=>el.onclick=()=>{farve=el.dataset.h;drawColors();});
}
drawColors();

function showLogo(src){
  $('dropInner').innerHTML=src
    ? `<img src="${src}" alt="Logo"/><span>Træk et nyt logo herind for at skifte</span><br><span class="rm" id="rm">Fjern logo</span>`
    : 'Træk logoet herind<br><small>eller tryk for at vælge en fil</small>';
  const rm=$('rm'); if(rm) rm.onclick=e=>{e.stopPropagation();logo='';logoChanged=true;showLogo(null);};
}

function readFile(f){
  if(!f||!f.type.startsWith('image/')){msg('Det skal være et billede (png, jpg, svg)','err');return;}
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=600, s=Math.min(1,max/Math.max(img.width||max,img.height||max));
      const c=document.createElement('canvas');
      c.width=Math.round((img.width||max)*s); c.height=Math.round((img.height||max)*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      logo=c.toDataURL('image/png'); logoChanged=true; showLogo(logo); msg('Logo klar ✓','ok');
    };
    img.onerror=()=>msg('Kunne ikke læse billedet','err');
    img.src=r.result;
  };
  r.readAsDataURL(f);
}

const drop=$('drop');
drop.onclick=()=>$('file').click();
$('file').onchange=e=>readFile(e.target.files[0]);
drop.ondragover=e=>{e.preventDefault();drop.classList.add('over');};
drop.ondragleave=()=>drop.classList.remove('over');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');readFile(e.dataTransfer.files[0]);};

function msg(t,c){$('msg').textContent=t;$('msg').className='msg '+(c||'');}

function showStatus(s){
  const dot=$('dot'); dot.className='dot';
  const til=s.endsAt?new Date(s.endsAt).toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit'}):'';
  const hvem=s.firma||s.navn||'gæster';
  if(s.mode==='velkommen'){dot.classList.add('on');$('stxt').textContent='Skærmen viser: Velkommen til '+hvem;$('ssub').textContent=til?'Slukker selv kl. '+til:'';}
  else if(s.mode==='tak'){dot.classList.add('tak');$('stxt').textContent='Skærmen viser: Tak for besøget';$('ssub').textContent=til?'Slukker selv kl. '+til:'';}
  else{$('stxt').textContent='Skærmen viser: KPI-dashboardet';$('ssub').textContent='Ingen velkomst lige nu';}
}

async function load(){
  try{
    const s=await (await fetch('/api/welcome',{cache:'no-store'})).json();
    showStatus(s);
    if(!$('navn').value) $('navn').value=s.navn||'';
    if(!$('firma').value) $('firma').value=s.firma||'';
    if(s.farve){farve=s.farve;drawColors();}
    if(s.slut) $('slut').value=s.slut;
    if(s.hasLogo&&!logoChanged) showLogo('/api/welcome/logo?v='+s.logoVersion);
  }catch(e){$('stxt').textContent='Kan ikke få kontakt til skærmen';}
}

async function send(mode){
  const pin=$('pin').value.trim();
  if(!pin){msg('Skriv koden først','err');$('pin').focus();return;}
  if(mode==='velkommen'&&!$('navn').value.trim()&&!$('firma').value.trim()){msg('Skriv navn eller firma','err');return;}
  const body={pin,mode,navn:$('navn').value,firma:$('firma').value,farve,slut:$('slut').value};
  if(logoChanged) body.logo=logo||'';
  document.querySelectorAll('button').forEach(b=>b.disabled=true);
  msg('Sender...');
  try{
    const r=await fetch('/api/welcome',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||'Fejl');
    try{localStorage.setItem('racoon_pin',pin);}catch(e){}
    logoChanged=false; showStatus(d);
    msg(mode==='off'?'Slukket - dashboardet er tilbage ✓':'Sendt! TV\'et skifter om få sekunder ✓','ok');
  }catch(e){msg(e.message==='Forkert kode'?'Forkert kode - prøv igen':'Det virkede ikke: '+e.message,'err');}
  document.querySelectorAll('button').forEach(b=>b.disabled=false);
}

$('bVel').onclick=()=>send('velkommen');
$('bTak').onclick=()=>send('tak');
$('bOff').onclick=()=>send('off');
load(); setInterval(load,15000);
</script>
</body>
</html>
