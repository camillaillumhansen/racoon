<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Racoon Facility — KPI</title>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --g:#47D7AC;--gd:rgba(71,215,172,.12);--gb:rgba(71,215,172,.28);
  --b:#6366f1;--r:#ef4444;--gold:#C9A84C;
  --bg:#07070d;--card:#10101a;--bdr:#1c1c2e;--bdr2:#252538;
  --w:#fff;--s:rgba(255,255,255,.5);
  --font:'Work Sans',system-ui,sans-serif;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--w);font-family:var(--font)}

/* HEADER */
header{display:flex;justify-content:space-between;align-items:center;padding:0 20px;height:48px;background:#0b0b14;border-bottom:1px solid var(--bdr);flex-shrink:0}
.logo-img{height:34px;width:auto}
.hdr-r{display:flex;align-items:center;gap:20px}
#clock{font-size:1.5rem;font-weight:300;letter-spacing:.04em}
#date{font-size:.72rem;color:var(--s);text-align:right;text-transform:capitalize}
.live{display:flex;align-items:center;gap:6px;background:var(--gd);border:1px solid var(--gb);border-radius:999px;padding:4px 13px;font-size:.68rem;font-weight:800;color:var(--g);letter-spacing:.1em}
.dot{width:7px;height:7px;border-radius:50%;background:var(--g);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.25;transform:scale(.65)}}
.cbw{display:flex;align-items:center;gap:7px}
.cbl{font-size:.62rem;color:var(--s)}
#cbar{width:72px;height:3px;background:var(--bdr2);border-radius:2px;overflow:hidden}
#cfill{height:100%;background:var(--g);transition:width 1s linear}

/* PAGE: 3 rækker */
.page{height:calc(100vh - 48px);display:grid;grid-template-rows:36% 41% 23%;padding:8px 16px 8px;gap:8px}

/* ROW 1: Donut til venstre + 5 KPI-kort til højre i 2 rækker */
.r1{display:grid;grid-template-columns:200px 1fr;gap:8px;min-height:0}

/* Donut */
.dc{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;position:relative;overflow:hidden;min-height:0}
.dc::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(71,215,172,.07) 0%,transparent 65%);pointer-events:none}
.dw{position:relative;width:120px;height:120px}
.dw svg{transform:rotate(-90deg)}
.dctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dp{font-size:2.4rem;font-weight:900;color:var(--w);line-height:1}
.dsb{font-size:.6rem;font-weight:700;color:var(--s);margin-top:3px;letter-spacing:.1em;text-transform:uppercase}
.dl{display:flex;flex-direction:column;gap:6px;width:100%}
.dlr{display:flex;justify-content:space-between;align-items:center}
.dll{display:flex;align-items:center;gap:5px;font-size:.7rem;font-weight:600;color:var(--s)}
.dld{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dlv{font-size:.75rem;font-weight:800;color:var(--w)}

/* KPI-grid: 2 rækker × 3 kolonner */
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:10px;min-height:0}
.kc{background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:10px 14px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
.kc::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:12px 12px 0 0}
.kc.cg::after{background:var(--g)}
.kc.cb::after{background:var(--b)}
.kc.cr::after{background:var(--r)}
.kc.co::after{background:var(--gold)}
.kc.cd::after{background:var(--bdr2)}
.kl{font-size:.68rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--s);margin-bottom:6px}
.kv{font-size:clamp(1.5rem,2.4vw,2.2rem);font-weight:900;line-height:1;color:var(--w)}
.kv.g{color:var(--g)}.kv.r{color:var(--r)}.kv.o{color:var(--gold)}

/* ROW 2: 3 sælgerkort */
.r2{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;min-height:0}
.sc{background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:7px;position:relative;overflow:hidden;min-height:0}
.sc::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:14px 14px 0 0}
.sc.r1c::after{background:linear-gradient(90deg,var(--g),#34d399)}
.sc.r2c::after{background:linear-gradient(90deg,var(--gold),#fbbf24)}
.sc.r3c::after{background:linear-gradient(90deg,#64748b,#94a3b8)}
.st{display:flex;align-items:center;gap:12px}
.aw{position:relative;width:68px;height:68px;flex-shrink:0}
.av{width:68px;height:68px;border-radius:50%;object-fit:cover;position:absolute;inset:0}
.wr{position:absolute;top:-8px;left:-8px;width:84px;height:84px;transform:rotate(-90deg)}
.si{flex:1;min-width:0}
.sn{font-size:1.2rem;font-weight:800;color:var(--w);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr{font-size:.62rem;font-weight:600;color:var(--s);text-transform:uppercase;letter-spacing:.07em;margin-top:2px}
.wb-wrap{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.wb{padding:2px 7px;border-radius:999px;font-size:.62rem;font-weight:800}
.wb-r{background:rgba(71,215,172,.12);color:var(--g);border:1px solid rgba(71,215,172,.25)}
.wb-s{background:rgba(99,102,241,.12);color:#818cf8;border:1px solid rgba(99,102,241,.25)}
.wb-k{background:rgba(201,168,76,.12);color:var(--gold);border:1px solid rgba(201,168,76,.25)}
.ytd-block{background:rgba(71,215,172,.06);border:1px solid rgba(71,215,172,.15);border-radius:8px;padding:7px 10px}
.ytd-lbl{font-size:.62rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--s);margin-bottom:3px}
.ytd-val{font-size:clamp(1.3rem,2vw,1.9rem);font-weight:900;color:var(--g);line-height:1}
.ss{display:flex;flex-direction:column;gap:5px}
.sr2{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;background:rgba(255,255,255,.03);border:1px solid var(--bdr);border-radius:8px}
.sl{font-size:.65rem;font-weight:700;color:var(--s);text-transform:uppercase;letter-spacing:.05em}
.sv{font-size:.95rem;font-weight:800}
.sv.g{color:var(--g)}.sv.o{color:var(--gold)}.sv.b{color:#818cf8}

/* ROW 3: Fremgang + Succes + Hund */
.r3{display:grid;grid-template-columns:1.2fr 1fr 0.55fr;gap:8px;min-height:0}
.gc{background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.gc::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--b),var(--g));border-radius:14px 14px 0 0}
.gh{display:flex;justify-content:space-between;align-items:center}
.gl{font-size:.68rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--s)}
.gbadge{font-size:.78rem;font-weight:900;padding:3px 10px;background:var(--gd);border:1px solid var(--gb);border-radius:999px;color:var(--g)}
.big-prog-wrap{display:flex;flex-direction:column;gap:4px}
.big-prog-lbl{display:flex;justify-content:space-between}
.big-prog-name{font-size:.75rem;font-weight:700;color:var(--w)}
.big-prog-val{font-size:.75rem;font-weight:700;color:var(--s)}
.big-prog-track{height:11px;background:var(--bdr2);border-radius:6px;overflow:hidden}
.big-prog-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--g),#34d399);transition:width 1.2s ease}
.gbars{display:flex;flex-direction:column;gap:7px;flex:1;justify-content:center}
.gbr{display:flex;flex-direction:column;gap:3px}
.gbh{display:flex;justify-content:space-between}
.gbn{font-size:.72rem;font-weight:700;color:var(--w)}
.gbv{font-size:.72rem;font-weight:700;color:var(--s)}
.gbt{height:8px;background:var(--bdr2);border-radius:4px;overflow:hidden}
.gbf{height:100%;border-radius:4px;transition:width 1.2s ease}
.gf1{background:linear-gradient(90deg,var(--g),#34d399)}
.gf2{background:linear-gradient(90deg,var(--gold),#fbbf24)}
.gf3{background:linear-gradient(90deg,#64748b,#94a3b8)}
.succ{background:var(--card);border:1px solid rgba(201,168,76,.3);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.succ::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),#fbbf24,var(--gold));border-radius:14px 14px 0 0}
.seb{font-size:.65rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.sbody{display:flex;align-items:flex-start;gap:12px;flex:1}
.sav{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);flex-shrink:0}
.sname{font-size:1.4rem;font-weight:900;color:var(--gold);line-height:1}
.sprize{font-size:.65rem;font-weight:700;color:var(--s);margin-top:3px;margin-bottom:6px}
.bbl{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px 10px 10px 3px;padding:8px 10px;font-size:.75rem;font-weight:600;color:var(--w);line-height:1.5}
.dog{background:var(--card);border:1px solid rgba(245,158,11,.25);border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden}
.dog::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#f59e0b,#fbbf24);border-radius:14px 14px 0 0}
.deb{font-size:.62rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#f59e0b}
.dem{font-size:3rem;line-height:1}
.dn{font-size:1.9rem;font-weight:900;color:var(--w)}
#err{display:none;position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:100;background:rgba(239,68,68,.15);border:1px solid var(--r);color:var(--r);padding:6px 14px;border-radius:8px;font-size:.75rem}
</style>
</head>
<body>
<script src="avatars.js"></script>
<header>
  <img class="logo-img" id="logo-img" alt="Racoon Facility"/>
  <div class="hdr-r">
    <div class="cbw"><span class="cbl">opdaterer om</span><div id="cbar"><div id="cfill" style="width:100%"></div></div></div>
    <div class="live"><div class="dot"></div>LIVE</div>
    <div><div id="clock">--:--:--</div><div id="date">-</div></div>
  </div>
</header>

<div class="page">
  <div id="err"></div>

  <!-- ROW 1: Donut + KPI-grid -->
  <div class="r1">
    <div class="dc">
      <div class="dw">
        <svg width="120" height="120" viewBox="0 0 150 150">
          <circle cx="75" cy="75" r="58" fill="none" stroke="#1c1c2e" stroke-width="16"/>
          <circle id="darc" cx="75" cy="75" r="58" fill="none" stroke="url(#dg)" stroke-width="16" stroke-linecap="round"
                  stroke-dasharray="364.4" stroke-dashoffset="364.4"
                  style="transition:stroke-dashoffset 1.5s ease;filter:drop-shadow(0 0 8px rgba(71,215,172,.3))"/>
          <defs><linearGradient id="dg" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#47D7AC"/><stop offset="100%" stop-color="#6366f1"/></linearGradient></defs>
        </svg>
        <div class="dctr"><div class="dp" id="dpct">-</div><div class="dsb">af mål 2026</div></div>
      </div>
      <div class="dl">
        <div class="dlr"><span class="dll"><span class="dld" style="background:var(--g)"></span>Status ÅTD</span><span class="dlv" id="ls">-</span></div>
        <div class="dlr"><span class="dll"><span class="dld" style="background:#333"></span>To Go</span><span class="dlv" id="lt">-</span></div>
        <div class="dlr"><span class="dll"><span class="dld" style="background:var(--b)"></span>Mål 2026</span><span class="dlv" id="lm">-</span></div>
      </div>
    </div>
    <div class="kgrid" id="kgrid"></div>
  </div>

  <!-- ROW 2: 3 sælgerkort -->
  <div class="r2" id="r2"></div>

  <!-- ROW 3: Fremgang + Succes + Hund -->
  <div class="r3" id="r3"></div>
</div>

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAArR7qPTCitHuo9MAoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAArR7qPTCitHuo9MAoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAArR7qPTCitHuo9MAoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAArR7qPTCitHuo9MAoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAArR7qPTCitHuo9MAoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAArR7qPTCitHuo9MAoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAArR7qPTAA/9k=';
document.getElementById('logo-img').src = (typeof LOGO !== 'undefined') ? LOGO : LOGO_INLINE;
const REFRESH = 30000;

const BIG = [
  {label:'Status',        cls:'cg', vcls:'g'},
  {label:'Mål 2026',      cls:'cb', vcls:''},
  {label:'To Go',         cls:'cr', vcls:'r'},
  {label:'Indeks',        cls:'co', vcls:'o'},
  {label:'Resultat 2025', cls:'cd', vcls:''},
];

const SELLERS_CFG = {
  Andreas:{img:()=>AVATARS.andreas,role:'Account Manager',ytd:'Andreas - ÅTD',pipeline:'Andreas Pipeline',kanvas:'Andreas Kanvas Kald',recovery:'Woop Recovery Andreas',sleep:'Woop Sleep Andreas',steps:'Woop Skridt Andreas'},
  Oscar:  {img:()=>AVATARS.oscar,  role:'Account Manager',ytd:'Oscar - ÅTD',  pipeline:'Oscar Pipeline',  kanvas:'Oscar Kanvas Kald',  recovery:'Woop Recovery Oscar',  sleep:'Woop Sleep Oscar',  steps:'Woop Skridt Oscar'},
  Michael:{img:()=>AVATARS.michael,role:'Account Manager',ytd:'Michael - ÅTD',pipeline:'Michael Pipeline',kanvas:'Michael Kanvas Kald',recovery:'Woop Recovery Michael',sleep:'Woop Sleep Michael',steps:'Woop Skridt Michael'},
  Victor: {img:()=>AVATARS.victor, role:'Student', leads:'Victor Leads', leadsMaal:'Victor Leads Mål'},
};

const FALLBACK='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60"><circle cx="30" cy="30" r="30" fill="#1e2d45"/><circle cx="30" cy="22" r="10" fill="#47D7AC"/><ellipse cx="30" cy="50" rx="16" ry="12" fill="#47D7AC"/></svg>');
const AMAP={'Andreas':()=>AVATARS.andreas,'Oscar':()=>AVATARS.oscar,'Michael':()=>AVATARS.michael,'Kristtina':()=>AVATARS.kristtina,'Camilla':()=>AVATARS.camilla,'Victor':()=>AVATARS.victor};
function gav(n){const f=AMAP[n];return (f&&f())?f():'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60"><circle cx="30" cy="30" r="30" fill="#1e2d45"/><circle cx="30" cy="22" r="10" fill="#47D7AC"/><ellipse cx="30" cy="50" rx="16" ry="12" fill="#47D7AC"/></svg>');}
function fmt(v,u){const n=parseFloat(v);if(isNaN(n))return'–';if(u==='DKK'){if(n>=1e6)return(n/1e6).toLocaleString('da-DK',{maximumFractionDigits:2})+' M';if(n>=1e3)return(n/1e3).toLocaleString('da-DK',{maximumFractionDigits:1})+' K';}if(u==='%')return n.toLocaleString('da-DK',{maximumFractionDigits:1});return n.toLocaleString('da-DK',{maximumFractionDigits:0});}
function kv(kpis,l){const k=kpis.find(x=>x.label===l);return k?parseFloat(k.value):0;}
function kvs(kpis,l){const k=kpis.find(x=>x.label===l);return k?k.description||'–':'–';}
function wc(v){return v>=80?'#47D7AC':v>=60?'#C9A84C':'#ef4444';}
function ring(cx,cy,r,pct,color,sw){const c=2*Math.PI*r,off=c-(Math.min(100,pct)/100)*c;return`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>`;}

function renderR1(kpis){
  const m=kv(kpis,'Mål 2026');
  document.getElementById('kgrid').innerHTML=BIG.map(cfg=>{
    const k=kpis.find(x=>x.label===cfg.label)||{value:0,unit:'',description:''};
    const val=cfg.label==='Indeks'?fmt(k.value,'%')+'%':k.unit==='DKK'?fmt(k.value,'DKK')+' kr':fmt(k.value,k.unit);
    return`<div class="kc ${cfg.cls}"><div class="kl">${cfg.label}</div><div class="kv ${cfg.vcls}">${val}</div></div>`;
  }).join('');
}

function renderDonut(kpis){
  const s=kv(kpis,'Status'),m=kv(kpis,'Mål 2026'),t=kv(kpis,'To Go');
  const pct=Math.min(100,(s/m)*100),c=2*Math.PI*58;
  document.getElementById('darc').style.strokeDashoffset=c-(pct/100)*c;
  document.getElementById('dpct').textContent=pct.toLocaleString('da-DK',{maximumFractionDigits:1})+'%';
  document.getElementById('ls').textContent=fmt(s,'DKK')+' kr';
  document.getElementById('lt').textContent=fmt(t,'DKK')+' kr';
  document.getElementById('lm').textContent=fmt(m,'DKK')+' kr';
}

function renderR2(kpis){
  const ytds=[['Andreas',kv(kpis,'Andreas - ÅTD')],['Oscar',kv(kpis,'Oscar - ÅTD')],['Michael',kv(kpis,'Michael - ÅTD')]];
  ytds.sort((a,b)=>b[1]-a[1]);
  const rm={};ytds.forEach(([n],i)=>rm[n]=i+1);
  const rc=['r1c','r2c','r3c'];
  document.getElementById('r2').innerHTML=Object.entries(SELLERS_CFG).map(([name,s])=>{

    // Victor - særligt kort
    if(name==='Victor'){
      const leads=kv(kpis,s.leads), maal=kv(kpis,s.leadsMaal)||120;
      const pct=Math.min(100,(leads/maal)*100);
      return`<div class="sc r3c">
        <div class="st">
          <div class="aw" style="width:56px;height:56px"><img class="av" src="${s.img()||FALLBACK}" alt="${name}" style="width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid #64748b"/></div>
          <div class="si">
            <div class="sn">${name}</div>
            <div class="sr">${s.role}</div>
          </div>
        </div>
        <div class="ytd-block">
          <div class="ytd-lbl">Leads fundet</div>
          <div class="ytd-val" style="font-size:clamp(1.6rem,2.5vw,2.4rem)">${leads} <span style="font-size:.9rem;color:var(--s);font-weight:400">/ ${maal}</span></div>
        </div>
        <div style="height:8px;background:var(--bdr2);border-radius:4px;overflow:hidden">
          <div style="height:100%;width:${Math.max(2,pct)}%;background:linear-gradient(90deg,var(--g),#34d399);border-radius:4px;transition:width 1.2s ease"></div>
        </div>
        <div style="font-size:.65rem;color:var(--s);font-weight:600">Mål: ${maal} leads</div>
      </div>`;
    }

    // Andreas, Oscar, Michael
    const rank=rm[name],cls=rc[rank-1];
    const ytd=kv(kpis,s.ytd),pl=kv(kpis,s.pipeline),kn=kv(kpis,s.kanvas);
    const rec=kv(kpis,s.recovery),slp=kv(kpis,s.sleep),stp=kv(kpis,s.steps);
    const rings=`<svg class="wr" viewBox="0 0 84 84">${ring(42,42,39,rec,wc(rec),4)}${ring(42,42,32,slp,'#818cf8',4)}${ring(42,42,25,Math.min(100,(stp/10000)*100),wc(Math.min(100,(stp/10000)*100)),4)}</svg>`;
    return`<div class="sc ${cls}">
      <div class="st">
        <div class="aw"><img class="av" src="${s.img()||FALLBACK}" alt="${name}"/>${rings}</div>
        <div class="si">
          <div class="sn">${name}</div>
          <div class="sr">${s.role}</div>
          <div class="wb-wrap">
            <span class="wb wb-r">💚 ${rec}%</span>
            <span class="wb wb-s">😴 ${slp}%</span>
            <span class="wb wb-k">👟 ${stp.toLocaleString('da-DK')}</span>
          </div>
        </div>
      </div>
      <div class="ytd-block">
        <div class="ytd-lbl">ÅTD Omsætning</div>
        <div class="ytd-val">${fmt(ytd,'DKK')} kr</div>
      </div>
      <div class="ss">
        <div class="sr2"><span class="sl">Pipeline</span><span class="sv o">${pl?fmt(pl,'DKK')+' kr':'–'}</span></div>
        <div class="sr2"><span class="sl">Kanvas kald/uge</span><span class="sv b">${kn||'–'}</span></div>
      </div>
    </div>`;
  }).join('');
}

function renderR3(kpis){
  const maal=kv(kpis,'Mål 2026');
  const totalS=kv(kpis,'Status'),totalP=Math.min(100,(totalS/maal)*100);
  const sellers=[{n:'Andreas',k:'Andreas - ÅTD',c:'gf1'},{n:'Oscar',k:'Oscar - ÅTD',c:'gf2'},{n:'Michael',k:'Michael - ÅTD',c:'gf3'}];
  const goalHtml=`<div class="gc">
    <div class="gh"><div class="gl">Fremgang mod mål 2026</div><div class="gbadge">${totalP.toFixed(1)}% samlet</div></div>
    <div class="big-prog-wrap">
      <div class="big-prog-lbl"><span class="big-prog-name">Samlet team</span><span class="big-prog-val">${fmt(totalS,'DKK')} kr af ${fmt(maal,'DKK')} kr</span></div>
      <div class="big-prog-track"><div class="big-prog-fill" style="width:${Math.max(2,totalP)}%"></div></div>
    </div>
    <div class="gbars">${sellers.map(s=>{const v=kv(kpis,s.k),p=Math.min(100,(v/maal)*100);return`<div class="gbr"><div class="gbh"><span class="gbn">${s.n}</span><span class="gbv">${fmt(v,'DKK')} kr</span></div><div class="gbt"><div class="gbf ${s.c}" style="width:${Math.max(2,p)}%"></div></div></div>`;}).join('')}</div>
  </div>`;
  const sn=kvs(kpis,'Succes Navn');
  const succesHtml=`<div class="succ">
    <div class="seb">🏆 Månedens succes</div>
    <div class="sbody">
      <img class="sav" src="${gav(sn)}" alt="${sn}"/>
      <div><div class="sname">${sn}</div><div class="sprize">${kvs(kpis,'Succes Præmie')}</div><div class="bbl">${kvs(kpis,'Succes Tekst')}</div></div>
    </div>
  </div>`;
  const hn=kvs(kpis,'Månedens Hund');
  const ht=kvs(kpis,'Hund Tekst');
  const hundHtml=`<div class="dog">
    <div class="deb">Månedens hund 🐾</div>
    <img src="hund.jpg?v=${Date.now()}" onerror="this.src='${AVATARS.shivas||FALLBACK}'" alt="${hn}" style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid #f59e0b;margin:4px 0"/>
    <div class="dn">${hn}</div>
    ${ht!=='–'?`<div style="font-size:.68rem;color:var(--s);text-align:center;line-height:1.4;margin-top:2px">${ht}</div>`:''}
  </div>
  </div>`;
  document.getElementById('r3').innerHTML=goalHtml+succesHtml+hundHtml;
}

async function fetchKPIs(){
  try{
    const r=await fetch('/api/kpi');if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();if(d.error)throw new Error(d.error);
    renderR1(d.kpis);renderDonut(d.kpis);renderR2(d.kpis);renderR3(d.kpis);
    document.getElementById('err').style.display='none';
  }catch(e){
    document.getElementById('err').style.display='block';
    document.getElementById('err').textContent='Fejl: '+e.message;
  }
}
function clock(){const n=new Date();document.getElementById('clock').textContent=n.toLocaleTimeString('da-DK');document.getElementById('date').textContent=n.toLocaleDateString('da-DK',{weekday:'long',day:'numeric',month:'long'});}
let t0=Date.now();
fetchKPIs();clock();
setInterval(clock,1000);
setInterval(()=>{document.getElementById('cfill').style.width=Math.max(0,100-((Date.now()-t0)/REFRESH)*100)+'%';},500);
setInterval(()=>{fetchKPIs();t0=Date.now();},REFRESH);
</script>
</body>
