<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Racoon Facility — KPI</title>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --green:  #47D7AC; --green-d:rgba(71,215,172,0.12); --green-b:rgba(71,215,172,0.28);
      --blue:   #6366f1; --blue-d:rgba(99,102,241,0.12);
      --red:    #ef4444; --gold:#C9A84C; --gold-d:rgba(201,168,76,0.12);
      --bg:#06060a; --card:#0e0e14; --border:#1a1a28; --border2:#252535;
      --white:#ffffff; --soft:rgba(255,255,255,0.55);
      --font:'Work Sans',system-ui,sans-serif;
    }
    html,body { height:100%; overflow:hidden; background:var(--bg); color:var(--white); font-family:var(--font); }

    /* HEADER */
    header { display:flex; justify-content:space-between; align-items:center; padding:0 32px; height:64px; border-bottom:1px solid var(--border); background:#0a0a12; }
    .logo-img { height:36px; }
    .hdr-right { display:flex; align-items:center; gap:18px; }
    #clock { font-size:1.4rem; font-weight:300; letter-spacing:.04em; }
    #date { font-size:.68rem; color:var(--soft); text-align:right; text-transform:capitalize; }
    .live-pill { display:flex; align-items:center; gap:6px; background:var(--green-d); border:1px solid var(--green-b); border-radius:999px; padding:3px 12px; font-size:.65rem; font-weight:800; color:var(--green); letter-spacing:.1em; }
    .pulse { width:6px; height:6px; border-radius:50%; background:var(--green); animation:pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.25;transform:scale(.65)} }
    #cbar-wrap { display:flex; align-items:center; gap:7px; }
    .cbar-lbl { font-size:.62rem; color:var(--soft); }
    #cbar { width:70px; height:3px; background:var(--border2); border-radius:2px; overflow:hidden; }
    #cfill { height:100%; background:var(--green); transition:width 1s linear; }

    /* MAIN — 3 rækker */
    main { height:calc(100vh - 64px); display:grid; grid-template-rows:88px 1fr 22%; padding:10px 24px 10px; gap:10px; }

    /* ROW 1 — 5 KPI-kort */
    .row1 { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
    .kpi-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:11px 14px; position:relative; overflow:hidden; }
    .kpi-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; border-radius:12px 12px 0 0; }
    .kpi-card.c-green::before { background:var(--green); }
    .kpi-card.c-blue::before  { background:var(--blue); }
    .kpi-card.c-red::before   { background:var(--red); }
    .kpi-card.c-gold::before  { background:var(--gold); }
    .kpi-card.c-dim::before   { background:var(--border2); }
    .kpi-label { font-size:.7rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--soft); margin-bottom:6px; }
    .kpi-val { font-size:clamp(1.4rem,2.2vw,2rem); font-weight:900; color:var(--white); line-height:1; }
    .kpi-val.green { color:var(--green); }
    .kpi-val.red   { color:var(--red); }
    .kpi-val.gold  { color:var(--gold); }
    .kpi-val.big   { font-size:clamp(1.5rem,2.4vw,2.2rem); }

    /* ROW 2 — donut + sælgere */
    .row2 { display:grid; grid-template-columns:190px 1fr; gap:10px; min-height:0; }

    /* Donut */
    .donut-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px 16px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; position:relative; overflow:hidden; min-height:0; }
    .donut-card::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse at 50% 0%,rgba(71,215,172,.06) 0%,transparent 65%); pointer-events:none; }
    .donut-wrap { position:relative; width:120px; height:120px; }
    .donut-wrap svg { transform:rotate(-90deg); }
    .donut-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .donut-pct { font-size:1.8rem; font-weight:900; color:var(--white); line-height:1; }
    .donut-sub { font-size:.58rem; font-weight:700; color:var(--soft); margin-top:3px; letter-spacing:.1em; text-transform:uppercase; }
    .donut-legend { display:flex; flex-direction:column; gap:6px; width:100%; }
    .leg-row { display:flex; justify-content:space-between; align-items:center; }
    .leg-left { display:flex; align-items:center; gap:6px; font-size:.7rem; font-weight:600; color:var(--soft); }
    .leg-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
    .leg-val { font-size:.75rem; font-weight:800; color:var(--white); }

    /* Sælger-grid */
    .sellers { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; min-height:0; overflow:hidden; }
    .seller-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:7px; position:relative; overflow:hidden; min-height:0; }
    .seller-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; border-radius:14px 14px 0 0; }
    .seller-card.rank-1::before { background:linear-gradient(90deg,var(--green),#34d399); }
    .seller-card.rank-2::before { background:linear-gradient(90deg,var(--gold),#fbbf24); }
    .seller-card.rank-3::before { background:linear-gradient(90deg,#64748b,#94a3b8); }

    .seller-top { display:flex; align-items:center; gap:10px; }
    .avatar-wrap { position:relative; width:56px; height:56px; flex-shrink:0; }
    .avatar { width:56px; height:56px; border-radius:50%; object-fit:cover; position:absolute; top:0; left:0; }
    .woop-rings { position:absolute; top:-7px; left:-7px; width:70px; height:70px; transform:rotate(-90deg); }
    .seller-info { flex:1; min-width:0; }
    .seller-name { font-size:.95rem; font-weight:800; color:var(--white); }
    .seller-role { font-size:.58rem; font-weight:600; color:var(--soft); text-transform:uppercase; letter-spacing:.07em; margin-top:1px; }
    .woop-badges { display:flex; gap:4px; flex-wrap:wrap; margin-top:4px; }
    .woop-badge { display:flex; align-items:center; gap:2px; padding:2px 6px; border-radius:999px; font-size:.6rem; font-weight:800; }
    .wb-recovery { background:rgba(71,215,172,.12); color:var(--green); border:1px solid rgba(71,215,172,.25); }
    .wb-sleep    { background:rgba(99,102,241,.12); color:#818cf8; border:1px solid rgba(99,102,241,.25); }
    .wb-steps    { background:rgba(201,168,76,.12); color:var(--gold); border:1px solid rgba(201,168,76,.25); }

    .seller-stats { display:flex; flex-direction:column; gap:4px; }
    .s-stat { display:flex; justify-content:space-between; align-items:center; padding:5px 9px; background:rgba(255,255,255,.03); border:1px solid var(--border); border-radius:7px; }
    .s-lbl { font-size:.6rem; font-weight:700; color:var(--soft); text-transform:uppercase; letter-spacing:.05em; }
    .s-val { font-size:.85rem; font-weight:800; }
    .s-val.green { color:var(--green); }
    .s-val.gold  { color:var(--gold); }
    .s-val.blue  { color:#818cf8; }

    /* ROW 3 — succes + hund + fremgang */
    .row3 { display:grid; grid-template-columns:1fr 0.55fr 1fr; gap:10px; min-height:0; }

    /* Succes */
    .succes-card { background:var(--card); border:1px solid rgba(201,168,76,.3); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:10px; position:relative; overflow:hidden; box-shadow:0 0 24px rgba(201,168,76,.06); }
    .succes-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,var(--gold),#fbbf24,var(--gold)); border-radius:14px 14px 0 0; }
    .succes-eyebrow { font-size:.6rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); }
    .succes-body { display:flex; align-items:flex-start; gap:12px; flex:1; }
    .succes-avatar { width:64px; height:64px; border-radius:50%; object-fit:cover; border:2px solid var(--gold); box-shadow:0 0 12px rgba(201,168,76,.25); flex-shrink:0; }
    .succes-name { font-size:1.6rem; font-weight:900; color:var(--gold); line-height:1; }
    .succes-prize { font-size:.65rem; font-weight:700; color:var(--soft); margin-top:2px; margin-bottom:6px; }
    .bubble { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); border-radius:10px 10px 10px 3px; padding:8px 10px; font-size:.75rem; font-weight:600; color:var(--white); line-height:1.5; }

    /* Hund */
    .dog-card { background:var(--card); border:1px solid rgba(245,158,11,.25); border-radius:14px; padding:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; position:relative; overflow:hidden; }
    .dog-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,#f59e0b,#fbbf24); border-radius:14px 14px 0 0; }
    .dog-eyebrow { font-size:.6rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:#f59e0b; }
    .dog-emoji { font-size:3rem; }
    .dog-name { font-size:2rem; font-weight:900; color:var(--white); }

    /* Fremgang */
    .goal-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:10px; position:relative; overflow:hidden; height:100%; }
    .goal-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,var(--blue),var(--green)); border-radius:14px 14px 0 0; }
    .goal-header { display:flex; justify-content:space-between; align-items:center; }
    .goal-label { font-size:.6rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--soft); }
    .goal-badge { font-size:.72rem; font-weight:900; padding:2px 9px; background:var(--green-d); border:1px solid var(--green-b); border-radius:999px; color:var(--green); }
    .goal-bars { display:flex; flex-direction:column; gap:7px; flex:1; justify-content:center; }
    .gbr { display:flex; flex-direction:column; gap:3px; }
    .gbr-hdr { display:flex; justify-content:space-between; }
    .gbr-name { font-size:.7rem; font-weight:700; color:var(--white); }
    .gbr-val  { font-size:.7rem; font-weight:700; color:var(--soft); }
    .gbr-track { height:8px; background:var(--border2); border-radius:4px; overflow:hidden; }
    .gbr-fill { height:100%; border-radius:4px; transition:width 1.2s ease; }
    .gf-green { background:linear-gradient(90deg,var(--green),#34d399); }
    .gf-gold  { background:linear-gradient(90deg,var(--gold),#fbbf24); }
    .gf-dim   { background:linear-gradient(90deg,#64748b,#94a3b8); }

    #err { display:none; background:rgba(239,68,68,.1); border:1px solid var(--red); color:var(--red); padding:8px; border-radius:8px; font-size:.8rem; text-align:center; }
  </style>
</head>
<body>
<script src="avatars.js"></script>

<header>
  <img class="logo-img" id="logo-img" alt="Racoon Facility"/>
  <div class="hdr-right">
    <div id="cbar-wrap"><span class="cbar-lbl">opdaterer om</span><div id="cbar"><div id="cfill" style="width:100%"></div></div></div>
    <div class="live-pill"><div class="pulse"></div>LIVE</div>
    <div><div id="clock">--:--:--</div><div id="date">-</div></div>
  </div>
</header>

<main>
  <div id="err"></div>

  <!-- ROW 1: 5 KPI-kort -->
  <div class="row1" id="row1"></div>

  <!-- ROW 2: Donut + sælgere -->
  <div class="row2">
    <div class="donut-card">
      <div class="donut-wrap">
        <svg width="120" height="120" viewBox="0 0 140 140">
          <circle cx="70" cy="70" r="54" fill="none" stroke="#1a1a28" stroke-width="16"/>
          <circle id="darc" cx="70" cy="70" r="54" fill="none" stroke="url(#dg)" stroke-width="16" stroke-linecap="round"
                  stroke-dasharray="339.3" stroke-dashoffset="339.3"
                  style="transition:stroke-dashoffset 1.5s ease;filter:drop-shadow(0 0 6px rgba(71,215,172,.3))"/>
          <defs><linearGradient id="dg" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#47D7AC"/><stop offset="100%" stop-color="#6366f1"/></linearGradient></defs>
        </svg>
        <div class="donut-center"><div class="donut-pct" id="dpct">-</div><div class="donut-sub">af mål 2026</div></div>
      </div>
      <div class="donut-legend">
        <div class="leg-row"><span class="leg-left"><span class="leg-dot" style="background:var(--green)"></span>Status ÅTD</span><span class="leg-val" id="ls">-</span></div>
        <div class="leg-row"><span class="leg-left"><span class="leg-dot" style="background:#333"></span>To Go</span><span class="leg-val" id="lt">-</span></div>
        <div class="leg-row"><span class="leg-left"><span class="leg-dot" style="background:var(--blue)"></span>Mål 2026</span><span class="leg-val" id="lm">-</span></div>
      </div>
    </div>
    <div class="sellers" id="sellers"></div>
  </div>

  <!-- ROW 3: Succes + Hund + Fremgang -->
  <div class="row3" id="row3"></div>
</main>

<script>
document.getElementById('logo-img').src = LOGO;
const REFRESH = 30000;

const BIG = [
  {label:'Status',        cls:'c-green', vcls:'green'},
  {label:'Mål 2026',      cls:'c-blue',  vcls:''},
  {label:'To Go',         cls:'c-red',   vcls:'red', big:true},
  {label:'Indeks',        cls:'c-gold',  vcls:'gold'},
  {label:'Resultat 2025', cls:'c-dim',   vcls:''},
];

const SELLERS_CFG = {
  Andreas: { img:()=>AVATARS.andreas, role:'Account Manager', ytd:'Andreas - ÅTD', pipeline:'Andreas Pipeline', kanvas:'Andreas Kanvas Kald', recovery:'Woop Recovery Andreas', sleep:'Woop Sleep Andreas', steps:'Woop Skridt Andreas' },
  Oscar:   { img:()=>AVATARS.oscar,   role:'Account Manager', ytd:'Oscar - ÅTD',   pipeline:'Oscar Pipeline',   kanvas:'Oscar Kanvas Kald',   recovery:'Woop Recovery Oscar',   sleep:'Woop Sleep Oscar',   steps:'Woop Skridt Oscar' },
  Michael: { img:()=>AVATARS.michael, role:'Account Manager', ytd:'Michael - ÅTD', pipeline:'Michael Pipeline', kanvas:'Michael Kanvas Kald', recovery:'Woop Recovery Michael', sleep:'Woop Sleep Michael', steps:'Woop Skridt Michael' },
};

const AVATAR_MAP = {
  'Andreas':()=>AVATARS.andreas,'Oscar':()=>AVATARS.oscar,'Michael':()=>AVATARS.michael,
  'Kristtina':()=>AVATARS.kristtina,'Camilla':()=>AVATARS.camilla,
};

function getAvatar(name) {
  const fn = AVATAR_MAP[name];
  return fn ? fn() : 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60"><circle cx="30" cy="30" r="30" fill="#1e2d45"/><circle cx="30" cy="22" r="10" fill="#47D7AC"/><ellipse cx="30" cy="50" rx="16" ry="12" fill="#47D7AC"/></svg>');
}

function fmt(v,u){ const n=parseFloat(v); if(isNaN(n)) return v; if(u==='DKK'){if(n>=1e6)return(n/1e6).toLocaleString('da-DK',{maximumFractionDigits:2})+' M';if(n>=1e3)return(n/1e3).toLocaleString('da-DK',{maximumFractionDigits:1})+' K';}if(u==='%')return n.toLocaleString('da-DK',{maximumFractionDigits:1});return n.toLocaleString('da-DK',{maximumFractionDigits:0}); }
function kv(kpis,l){ const k=kpis.find(x=>x.label===l); return k?parseFloat(k.value):0; }
function kvs(kpis,l){ const k=kpis.find(x=>x.label===l); return k?k.description||'':'';}
function woopColor(v){ return v>=80?'#47D7AC':v>=60?'#C9A84C':'#ef4444'; }
function ring(cx,cy,r,pct,color,sw){ const c=2*Math.PI*r,off=c-(pct/100)*c; return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>`; }

function renderRow1(kpis){
  const maal=kv(kpis,'Mål 2026');
  document.getElementById('row1').innerHTML = BIG.map(cfg=>{
    const k=kpis.find(x=>x.label===cfg.label)||{value:0,unit:'',description:''};
    const val = cfg.label==='Indeks' ? fmt(k.value,'%')+'%'
              : k.unit==='DKK'       ? fmt(k.value,'DKK')+' kr'
              : fmt(k.value,k.unit);
    return `<div class="kpi-card ${cfg.cls}">
      <div class="kpi-label">${cfg.label}</div>
      <div class="kpi-val ${cfg.vcls}${cfg.big?' big':''}">${val}</div>
    </div>`;
  }).join('');
}

function renderDonut(kpis){
  const s=kv(kpis,'Status'),m=kv(kpis,'Mål 2026'),t=kv(kpis,'To Go');
  const pct=Math.min(100,(s/m)*100),c=2*Math.PI*54;
  document.getElementById('darc').style.strokeDashoffset=c-(pct/100)*c;
  document.getElementById('dpct').textContent=pct.toLocaleString('da-DK',{maximumFractionDigits:1})+'%';
  document.getElementById('ls').textContent=fmt(s,'DKK')+' kr';
  document.getElementById('lt').textContent=fmt(t,'DKK')+' kr';
  document.getElementById('lm').textContent=fmt(m,'DKK')+' kr';
}

function renderSellers(kpis){
  const ytds=[['Andreas',kv(kpis,'Andreas - ÅTD')],['Oscar',kv(kpis,'Oscar - ÅTD')],['Michael',kv(kpis,'Michael - ÅTD')]];
  ytds.sort((a,b)=>b[1]-a[1]);
  const rankMap={}; ytds.forEach(([n],i)=>rankMap[n]=i+1);
  const maxYTD=ytds[0][1]||1;
  const rCls=['rank-1','rank-2','rank-3'];

  document.getElementById('sellers').innerHTML = Object.entries(SELLERS_CFG).map(([name,s])=>{
    const rank=rankMap[name], cls=rCls[rank-1];
    const ytd=kv(kpis,s.ytd), pipeline=kv(kpis,s.pipeline), kanvas=kv(kpis,s.kanvas);
    const recovery=kv(kpis,s.recovery), sleep=kv(kpis,s.sleep), steps=kv(kpis,s.steps);
    const rings=`<svg class="woop-rings" viewBox="0 0 70 70">${ring(35,35,32,recovery,woopColor(recovery),3.5)}${ring(35,35,26,sleep,'#818cf8',3.5)}${ring(35,35,20,Math.min(100,(steps/10000)*100),woopColor(Math.min(100,(steps/10000)*100)),3.5)}</svg>`;
    return `<div class="seller-card ${cls}">
      <div class="seller-top">
        <div class="avatar-wrap"><img class="avatar" src="${s.img()}" alt="${name}"/>${rings}</div>
        <div class="seller-info">
          <div class="seller-name">${name}</div>
          <div class="seller-role">${s.role}</div>
          <div class="woop-badges">
            <span class="woop-badge wb-recovery">💚 ${recovery}%</span>
            <span class="woop-badge wb-sleep">😴 ${sleep}%</span>
            <span class="woop-badge wb-steps">👟 ${steps.toLocaleString('da-DK')}</span>
          </div>
        </div>
      </div>
      <div class="seller-stats">
        <div class="s-stat"><span class="s-lbl">ÅTD</span><span class="s-val green">${fmt(ytd,'DKK')} kr</span></div>
        <div class="s-stat"><span class="s-lbl">Pipeline leads</span><span class="s-val gold">${pipeline}</span></div>
        <div class="s-stat"><span class="s-lbl">Kanvas kald/uge</span><span class="s-val blue">${kanvas}</span></div>
      </div>
    </div>`;
  }).join('');
}

function renderRow3(kpis){
  const maal=kv(kpis,'Mål 2026');

  // Succes
  const succesNavn   = kvs(kpis,'Succes Navn');
  const succesPraemie= kvs(kpis,'Succes Præmie');
  const succesTekst  = kvs(kpis,'Succes Tekst');
  const succesHtml = `<div class="succes-card">
    <div class="succes-eyebrow">🏆 Månedens succes</div>
    <div class="succes-body">
      <img class="succes-avatar" src="${getAvatar(succesNavn)}" alt="${succesNavn}"/>
      <div>
        <div class="succes-name">${succesNavn||'–'}</div>
        <div class="succes-prize">${succesPraemie||'–'}</div>
        <div class="bubble">${succesTekst||'–'}</div>
      </div>
    </div>
  </div>`;

  // Hund
  const hundNavn = kvs(kpis,'Månedens Hund');
  const hundHtml = `<div class="dog-card">
    <div class="dog-eyebrow">Månedens hund 🐾</div>
    <div class="dog-emoji">🐶</div>
    <div class="dog-name">${hundNavn||'–'}</div>
  </div>`;

  // Fremgang
  const sellers=[{n:'Andreas',k:'Andreas - ÅTD',c:'gf-green'},{n:'Oscar',k:'Oscar - ÅTD',c:'gf-gold'},{n:'Michael',k:'Michael - ÅTD',c:'gf-dim'}];
  const totalS=kv(kpis,'Status'), totalP=Math.min(100,(totalS/maal)*100);
  const goalHtml = `<div class="goal-card">
    <div class="goal-header">
      <div class="goal-label">Fremgang mod mål 2026</div>
      <div class="goal-badge">${totalP.toFixed(1)}% samlet</div>
    </div>
    <div class="goal-bars">${sellers.map(s=>{
      const v=kv(kpis,s.k), p=Math.min(100,(v/maal)*100);
      return `<div class="gbr"><div class="gbr-hdr"><span class="gbr-name">${s.n}</span><span class="gbr-val">${fmt(v,'DKK')} kr</span></div><div class="gbr-track"><div class="gbr-fill ${s.c}" style="width:${Math.max(2,p)}%"></div></div></div>`;
    }).join('')}</div>
  </div>`;

  document.getElementById('row3').innerHTML = succesHtml + hundHtml + goalHtml;
}

async function fetchKPIs(){
  try{
    const r=await fetch('/api/kpi'); if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json(); if(d.error) throw new Error(d.error);
    renderRow1(d.kpis);
    renderDonut(d.kpis);
    renderSellers(d.kpis);
    renderRow3(d.kpis);
    document.getElementById('err').style.display='none';
  }catch(e){
    document.getElementById('err').style.display='block';
    document.getElementById('err').textContent='Fejl: '+e.message;
  }
}

function clock(){ const n=new Date(); document.getElementById('clock').textContent=n.toLocaleTimeString('da-DK'); document.getElementById('date').textContent=n.toLocaleDateString('da-DK',{weekday:'long',day:'numeric',month:'long'}); }
let t0=Date.now();
fetchKPIs(); clock();
setInterval(clock,1000);
setInterval(()=>{ document.getElementById('cfill').style.width=Math.max(0,100-((Date.now()-t0)/REFRESH)*100)+'%'; },500);
setInterval(()=>{ fetchKPIs(); t0=Date.now(); },REFRESH);
</script>
